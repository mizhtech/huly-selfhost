name: ${DOCKER_NAME}

x-huly-service: &huly-service
  pull_policy: never
  restart: unless-stopped
  networks:
    - huly_net

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8087}:80"
    volumes:
      - ./.huly.nginx:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - account
      - collaborator
      - transactor
      - rekoni
      - datalake
      - hulylake
      - export
      - stream
    restart: unless-stopped
    networks:
      - huly_net

  cockroach:
    image: cockroachdb/cockroach:latest-v24.3
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE}
      - COCKROACH_USER=${CR_USERNAME}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD}
    volumes:
      - ${VOLUME_CR_DATA_PATH:-cr_data}:/cockroach/cockroach-data
      - ${VOLUME_CR_CERTS_PATH:-cr_certs}:/cockroach/certs
    restart: unless-stopped
    networks:
      - huly_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082
      - --schema-registry-addr
      - internal://0.0.0.0:8081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --memory
      - 512M
    volumes:
      - ${VOLUME_REDPANDA_PATH:-redpanda}:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huly_net

  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  jaeger:
    image: jaegertracing/all-in-one:latest
    volumes:
      - telemetry:/badger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    restart: unless-stopped
    networks:
      - huly_net

  stream:
    <<: *huly-service
    image: hardcoreeng/stream
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4030
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=${SECRET}
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=info
      - AWS_ACCESS_KEY_ID=${EXTERNAL_MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${EXTERNAL_MINIO_SECRET_KEY}
      - STREAM_REGION=cockroach
      - STREAM_QUEUE_CONFIG=redpanda:9092
    depends_on:
      - datalake
      - redpanda

  media:
    <<: *huly-service
    image: hardcoreeng/media
    environment:
      - ACCOUNTS_URL=http://account:3000
      - SECRET=${SECRET}
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - account
      - redpanda

  account:
    <<: *huly-service
    image: hardcoreeng/account
    environment:
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_SECRET=${SECRET}
      - ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-admin}
      - WORKSPACE_LIMIT_PER_USER=10000
      - DB_URL=${CR_DB_URL}
      - REGION_INFO=cockroach|CockroachDB
      - TRANSACTOR_URL=ws://transactor:3332;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - MAIL_URL=
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - MODEL_ENABLED=*
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy

  workspace:
    <<: *huly-service
    networks:
      - huly_net
      - external_minio_net
    image: hardcoreeng/workspace
    environment:
      - WS_OPERATION=all+backup
      - REGION=cockroach
      - SERVER_SECRET=${SECRET}
      - QUEUE_CONFIG=redpanda:9092
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=${CR_DB_URL}
      - BACKUP_STORAGE=minio|${EXTERNAL_MINIO_ENDPOINT}?accessKey=${EXTERNAL_MINIO_ACCESS_KEY}&secretKey=${EXTERNAL_MINIO_SECRET_KEY}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME:-huly-backups}
      - MAIL_URL=
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
      datalake:
        condition: service_started

  collaborator:
    <<: *huly-service
    image: hardcoreeng/collaborator
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - account
      - transactor
      - datalake

  front:
    <<: *huly-service
    image: hardcoreeng/front
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - FILES_URL=http${SECURE:+s}://${HOST_ADDRESS}/_datalake/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=/files
      - REKONI_URL=http${SECURE:+s}://${HOST_ADDRESS}/_rekoni
      - COLLABORATOR_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - TITLE=${TITLE:-Huly}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-vi}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_URL=https://dist.huly.io
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL:-dev}
      - BRANDING_URL=http${SECURE:+s}://${HOST_ADDRESS}/branding.json
      - STREAM_URL=http${SECURE:+s}://${HOST_ADDRESS}/_stream/recording
      - COMMUNICATION_API_ENABLED=true
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=[]
      - DISABLED_FEATURES=auto-translate,mailboxes
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - DATALAKE_URL=http${SECURE:+s}://${HOST_ADDRESS}/_datalake
      - HULYLAKE_URL=http${SECURE:+s}://${HOST_ADDRESS}/_hulylake
      - EXPORT_URL=http${SECURE:+s}://${HOST_ADDRESS}/_export
    depends_on:
      - account
      - collaborator
      - datalake
      - hulylake

  transactor:
    <<: *huly-service
    image: hardcoreeng/transactor
    environment:
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_PORT=3332
      - REGION=cockroach
      - SERVER_SECRET=${SECRET}
      - ENABLE_COMPRESSION=true
      - DB_URL=${CR_DB_URL}
      - METRICS_CONSOLE=false
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - MAIL_URL=
      - ACCOUNTS_URL=http://account:3000
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - COMMUNICATION_TIME_LOGGING_ENABLED=true
      - RATE_LIMIT_MAX=250
      - RATE_LIMIT_WINDOW=30000
      - FILES_URL=http${SECURE:+s}://${HOST_ADDRESS}/_datalake/blob/:workspace/:blobId/:filename
      - COMMUNICATION_API_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - HULYLAKE_URL=http://hulylake:8096
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
      datalake:
        condition: service_started

  rekoni:
    <<: *huly-service
    image: hardcoreeng/rekoni-service
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces

  analytics:
    <<: *huly-service
    image: hardcoreeng/analytics-collector
    environment:
      - SECRET=${SECRET}
      - PORT=4017
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://account:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - account

  export:
    <<: *huly-service
    image: hardcoreeng/export
    environment:
      - PORT=4009
      - SECRET=${SECRET}
      - SERVICE_ID=export-service
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - account
      - datalake

  datalake:
    <<: *huly-service
    networks:
      - huly_net
      - external_minio_net
    image: hardcoreeng/datalake
    environment:
      - PORT=4030
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - DB_URL=${CR_DB_URL}
      - BUCKETS=blobs,eu|${EXTERNAL_MINIO_URL}?accessKey=${EXTERNAL_MINIO_ACCESS_KEY}&secretKey=${EXTERNAL_MINIO_SECRET_KEY}
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      account:
        condition: service_started

  hulylake:
    <<: *huly-service
    networks:
      - huly_net
      - external_minio_net
    image: hardcoreeng/hulylake
    environment:
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_DB_CONNECTION=${CR_DB_URL}
      - AWS_ENDPOINT_URL=${EXTERNAL_MINIO_URL}
      - AWS_REGION=${EXTERNAL_MINIO_REGION:-local}
      - AWS_ACCESS_KEY_ID=${EXTERNAL_MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${EXTERNAL_MINIO_SECRET_KEY}
    depends_on:
      cockroach:
        condition: service_started

  time-machine:
    <<: *huly-service
    image: hardcoreeng/worker
    environment:
      - DB_URL=${CR_DB_URL}
      - QUEUE_CONFIG=redpanda:9092
      - QUEUE_REGION=cockroach
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      account:
        condition: service_started

volumes:
  cr_data:
  cr_certs:
  redpanda:
  telemetry:

networks:
  huly_net:
  external_minio_net:
    external: true
    name: ${EXTERNAL_MINIO_NETWORK}
