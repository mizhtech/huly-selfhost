HULY_VERSION=v0.7.426
DESKTOP_CHANNEL=0.7.426
DOCKER_NAME=Huly

HULY_GIT_REPOSITORY=https://github.com/mizhtech/huly-platform.git
HULY_GIT_BRANCH=dev-v0.7.426
HULY_SOURCE_DIR=./source/huly-platform

HOST_ADDRESS=your-domain.com
SECURE=true
HTTP_PORT=8087
HTTP_BIND=127.0.0.1
SSL_CERTIFICATE=/apps/certs/your-domain.com/fullchain.pem
SSL_CERTIFICATE_KEY=/apps/certs/your-domain.com/privkey.pem

GATEWAY_NETWORK=your-gateway-network
GATEWAY_CONTAINER=your-gateway-container
GATEWAY_CONFIG_DIR=/path/to/gateway/generated

TITLE=Huly
DEFAULT_LANGUAGE=vi
LAST_NAME_FIRST=true
PLATFORM_ADMIN_EMAILS=admin@example.com
DISABLE_SIGNUP=true

# Outbound email (SMTP / Mailgun).
SMTP_FROM=postmaster@sandbox.example.mailgun.org
SMTP_HOST=smtp.mailgun.org
SMTP_PORT=587
SMTP_USERNAME=postmaster@sandbox.example.mailgun.org
SMTP_PASSWORD=change-me

CR_DATABASE=defaultdb
CR_USERNAME=selfhost
CR_USER_PASSWORD=change-me
CR_DB_URL=postgres://selfhost:change-me@cockroach:26257/defaultdb

REDPANDA_ADMIN_USER=superadmin
REDPANDA_ADMIN_PWD=change-me

EXTERNAL_MINIO_NETWORK=your-external-network
EXTERNAL_MINIO_ENDPOINT=minio.internal:9000
EXTERNAL_MINIO_URL=http://minio.internal:9000
EXTERNAL_MINIO_ACCESS_KEY=change-me
EXTERNAL_MINIO_SECRET_KEY=change-me
EXTERNAL_MINIO_REGION=local
BACKUP_BUCKET_NAME=huly-backups

CR_DATA_PATH=/workspace/apps/huly/data/cockroach
CR_CERTS_PATH=/workspace/apps/huly/data/cockroach-certs
REDPANDA_DATA_PATH=/workspace/apps/huly/data/redpanda
TELEMETRY_DATA_PATH=/workspace/apps/huly/data/telemetry

SECRET=change-me
