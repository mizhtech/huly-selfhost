EXTERNAL_MINIO_URL=${EXTERNAL_MINIO_URL}
EXTERNAL_MINIO_ACCESS_KEY=${EXTERNAL_MINIO_ACCESS_KEY}
EXTERNAL_MINIO_SECRET_KEY=${EXTERNAL_MINIO_SECRET_KEY}
EXTERNAL_MINIO_REGION=${EXTERNAL_MINIO_REGION}
BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME}

VOLUME_CR_DATA_PATH=${VOLUME_CR_DATA_PATH}
VOLUME_CR_CERTS_PATH=${VOLUME_CR_CERTS_PATH}
VOLUME_REDPANDA_PATH=${VOLUME_REDPANDA_PATH}

SECRET=${HULY_SECRET}
