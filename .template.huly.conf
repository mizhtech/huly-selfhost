HULY_VERSION=v0.7.426
DESKTOP_CHANNEL=0.7.426
DOCKER_NAME=Huly

# Fork source built locally before compose starts.
HULY_GIT_REPOSITORY=${HULY_GIT_REPOSITORY}
HULY_GIT_BRANCH=${HULY_GIT_BRANCH}
HULY_SOURCE_DIR=${HULY_SOURCE_DIR}

# Public production endpoint. TLS is terminated by host Nginx.
HOST_ADDRESS=${HOST_ADDRESS}
SECURE=${SECURE}
HTTP_PORT=${HTTP_PORT}
HTTP_BIND=${HTTP_BIND}
SSL_CERTIFICATE=${SSL_CERTIFICATE}
SSL_CERTIFICATE_KEY=${SSL_CERTIFICATE_KEY}

TITLE=${TITLE}
DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
LANGUAGE=${LANGUAGE}
LAST_NAME_FIRST=${LAST_NAME_FIRST}
PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}
DISABLE_SIGNUP=${DISABLE_SIGNUP}

# Outbound email (SMTP / Mailgun).
SMTP_FROM=${SMTP_FROM}
SMTP_HOST=${SMTP_HOST}
SMTP_PORT=${SMTP_PORT}
SMTP_USERNAME=${SMTP_USERNAME}
SMTP_PASSWORD=${SMTP_PASSWORD}

CR_DATABASE=${CR_DATABASE}
CR_USERNAME=${CR_USERNAME}
CR_USER_PASSWORD=${COCKROACH_SECRET}
CR_DB_URL=postgres://${CR_USERNAME}:${COCKROACH_SECRET}@cockroach:26257/${CR_DATABASE}

REDPANDA_ADMIN_USER=${REDPANDA_ADMIN_USER}
REDPANDA_ADMIN_PWD=${REDPANDA_SECRET}

# Stack-local MinIO. Containers use http://minio:9000; host ports are for administration/debugging only.
MINIO_IMAGE=${MINIO_IMAGE}
MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
MINIO_REGION=${MINIO_REGION}
MINIO_API_BIND=${MINIO_API_BIND}
MINIO_API_PORT=${MINIO_API_PORT}
MINIO_CONSOLE_BIND=${MINIO_CONSOLE_BIND}
MINIO_CONSOLE_PORT=${MINIO_CONSOLE_PORT}
MINIO_DATA_PATH=${MINIO_DATA_PATH}
BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME}

CR_DATA_PATH=${CR_DATA_PATH}
CR_CERTS_PATH=${CR_CERTS_PATH}
REDPANDA_DATA_PATH=${REDPANDA_DATA_PATH}
TELEMETRY_DATA_PATH=${TELEMETRY_DATA_PATH}

SECRET=${HULY_SECRET}
